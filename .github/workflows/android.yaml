name: CI - Android APK

# Builds an unsigned debug APK on every push / PR, and a release APK
# (signed if secrets are configured) on version tags.

on:
  push:
    branches:
      - "master"
      - "feature/**"
    tags:
      - "v[0-9]+\\.[0-9]+\\.[0-9]+"
  pull_request:
  workflow_dispatch:

env:
  # Qt version must match the desktop workflow to stay in sync
  QT_VERSION: "6.10.1"
  # Android API level must be >= CMakeLists QT_ANDROID_MIN_SDK_VERSION (26)
  ANDROID_API_LEVEL: 34
  # NDK version pinned for reproducibility
  ANDROID_NDK_VERSION: "26.3.11579264"
  # Build tools
  ANDROID_BUILD_TOOLS: "34.0.0"

jobs:
  build-android:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------------ #
      # 1. Source checkout                                                   #
      # ------------------------------------------------------------------ #
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # ------------------------------------------------------------------ #
      # 2. Toolchain setup                                                   #
      # ------------------------------------------------------------------ #
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and platform
        run: |
          sdkmanager --install \
            "ndk;${{ env.ANDROID_NDK_VERSION }}" \
            "platforms;android-${{ env.ANDROID_API_LEVEL }}" \
            "build-tools;${{ env.ANDROID_BUILD_TOOLS }}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/${{ env.ANDROID_NDK_VERSION }}"       >> $GITHUB_ENV

      # ------------------------------------------------------------------ #
      # 3. Qt installation                                                   #
      # ------------------------------------------------------------------ #

      # Host Qt provides qmake, uic, rcc, and other build-time tools needed
      # during cross-compilation.
      - name: Install Qt (host – desktop)
        id: qt-host
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: "desktop"
          arch: "linux_gcc_64"
          archives: "icu qtbase qttools"
          cache: true
          dir: ${{ runner.temp }}/qt-host

      # Android Qt libraries (arm64-v8a)
      - name: Install Qt (target – Android arm64-v8a)
        id: qt-android
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: "android"
          arch: "android_arm64_v8a"
          archives: "qtbase qtsvg qttools"
          cache: true

      # ------------------------------------------------------------------ #
      # 4. Build cache                                                       #
      # ------------------------------------------------------------------ #
      - name: Initialize ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ccache-android-${{ github.ref_name }}
          restore-keys: |
            ccache-android-master-
            ccache-android-

      # ------------------------------------------------------------------ #
      # 5. Configure                                                         #
      # ------------------------------------------------------------------ #
      - name: Configure CMake (Android)
        run: |
          # qt-cmake is the wrapper that injects the Qt Android toolchain
          "${{ env.QT_ROOT_DIR }}/bin/qt-cmake" \
            -B build-android \
            -G Ninja \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DCMAKE_ANDROID_NDK="$ANDROID_NDK" \
            -DQT_HOST_PATH="${{ runner.temp }}/qt-host/Qt/${{ env.QT_VERSION }}/gcc_64" \
            -DCMAKE_BUILD_TYPE=Release \
            -DTEST=OFF \
            -DENABLE_SIMD=OFF \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            .

      # ------------------------------------------------------------------ #
      # 6. Build                                                             #
      # ------------------------------------------------------------------ #
      - name: Build C++ libraries
        run: cmake --build build-android --parallel

      # androiddeployqt collects Qt shared libraries and generates a Gradle
      # project; the `apk` target then invokes Gradle to create the APK.
      - name: Package APK (debug, unsigned)
        run: cmake --build build-android --target apk

      # ------------------------------------------------------------------ #
      # 7. (Optional) Sign release APK when secrets are present             #
      # ------------------------------------------------------------------ #
      - name: Sign APK (release)
        if: startsWith(github.ref, 'refs/tags/') && env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64:  ${{ secrets.KEYSTORE_BASE64  }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS        }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD     }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          APK=$(find build-android -name "*-debug.apk" | head -1)
          OUT="${APK/-debug.apk/-release-signed.apk}"
          $ANDROID_SDK_ROOT/build-tools/${{ env.ANDROID_BUILD_TOOLS }}/apksigner sign \
            --ks keystore.jks \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$OUT" \
            "$APK"
          echo "SIGNED_APK=$OUT" >> $GITHUB_ENV
          rm -f keystore.jks

      # ------------------------------------------------------------------ #
      # 8. Upload artifacts                                                  #
      # ------------------------------------------------------------------ #
      - name: Locate built APKs
        id: find-apks
        run: |
          find build-android -name "*.apk" | tee apk-list.txt
          echo "APK_DIR=$(dirname $(head -1 apk-list.txt))" >> $GITHUB_ENV

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PokeFinder-Android-${{ github.sha }}
          path: build-android/**/*.apk

      # Publish signed release APK on version tags
      - name: Publish Release APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && env.SIGNED_APK != ''
        with:
          files: ${{ env.SIGNED_APK }}
